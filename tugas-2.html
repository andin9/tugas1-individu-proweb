<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        css


    body {
    margin: 0;
    padding: 40px 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fce4ec, #f3e5f5);
    min-height: 100vh;
    color: #444;
}

.container {
    width: 90%;
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
}

h1 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 10px;
    color: #ad1457;
    font-size: 32px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
    font-size: 15px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    font-weight: bold;
    color: #6a1b4d;
}

input[type="text"],
input[type="password"],
textarea,
select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    border: 2px solid #f3c5d8;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    background: #fffafd;
}

.option {
    align-items: center;
    gap: 10px;
    margin: 10px 0;
    padding: 10px 12px;
    background: #fff5f9;
    border-radius: 10px;
}
textarea {
    resize: vertical;
    min-height: 100px;
}

.option {
    align-items: center;
    gap: 10px;
    margin: 10px 0;
    padding: 10px 12px;
    background: #fff5f9;
    border-radius: 10px;
}

input[type="submit"] {
    width: 100%;
    margin-top: 30px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #ec407a, #ab47bc);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

</style>

<fieldset>
        <!DOCTYPE html>
<html>
<head>
    <title>K-Drama Fan Form</title>

    <!-- Menghubungkan HTML dengan CSS -->
    <link rel="stylesheet" href="form.css">
</head>

<body>

    <div class="container">

        <h1>🎬 K-Drama Fan Form</h1>
        <p class="subtitle">Tell us about your favorite Korean drama! 🇰🇷</p>

        <form>
        <fieldset>
            <!-- TEXT -->
            <label>Nama Lengkap</label>
            <input type="text" name="nama" placeholder="Masukkan nama kamu">

            <!-- PASSWORD -->
            <label>Password</label>
            <input type="password" name="password" placeholder="Masukkan password">

            <!-- TEXTAREA -->
            <label>Drama Korea Favorit & Alasannya</label>
            <textarea name="alasan" rows="5" placeholder="Contoh: Queen of Tears, karena ceritanya..."></textarea>

            <!-- RADIO BUTTON -->
            <label>Genre K-Drama Favorit</label>

            <div class="option">
                <input type="radio" name="genre" value="romance">
                <span>Romance 💕</span>
            </div>

            <div class="option">
                <input type="radio" name="genre" value="thriller">
                <span>Thriller 🔥</span>
            </div>

            <div class="option">
                <input type="radio" name="genre" value="comedy">
                <span>Comedy 😂</span>
            </div>

            <div class="option">
                <input type="radio" name="genre" value="action">
                <span>Action ⚔️</span>
            </div>

            <!-- CHECKBOX -->
            <label>Platform Streaming Favorit</label>

            <div class="option">
                <input type="checkbox" name="platform" value="netflix">
                <span>Netflix</span>
            </div>

            <div class="option">
                <input type="checkbox" name="platform" value="viu">
                <span>Viu</span>
            </div>

            <div class="option">
                <input type="checkbox" name="platform" value="disney">
                <span>Disney+</span>
            </div>

            <div class="option">
                <input type="checkbox" name="platform" value="tving">
                <span>TVING</span>
            </div>

            <!-- SELECT OPTION -->
            <label>Drama yang Paling Ingin Ditonton</label>

            <select name="drama">
                <option value="">-- Pilih Drama --</option>
                <option value="queen-of-tears">Queen of Tears</option>
                <option value="moving">Moving</option>
                <option value="twinkling-watermelon">Twinkling Watermelon</option>
                <option value="business-proposal">Business Proposal</option>
                <option value="when-the-phone-rings">When the Phone Rings</option>
            </select>

            <!-- SUBMIT -->
            <input type="submit" value="Kirim Form 🎬">
        </fieldset>
        </form>

    </div>

       
    </body>
</html>
</body>
</html>
